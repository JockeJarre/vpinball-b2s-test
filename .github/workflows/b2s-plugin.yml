# Builds only the B2S plugin for Windows (no application), and uploads the plugin
# folder as a zip artifact: extract it into the Visual Pinball "plugins" folder
# (it provides plugins/b2s-pro/, so that it does not collide with the official B2S
# plugin). Manually runnable from any branch, run on pull requests touching the
# plugin, and run on pushes to master and b2s-pro.
name: b2s-plugin
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Build configuration"
        required: false
        default: Release
        type: choice
        options: [Release, Debug]
  pull_request:
    paths:
      - plugins/b2s/**
      - plugins/plugins/**
      - CMakeLists.txt
      - make/CMakeLists_plugin_B2S.txt
      - make/CMakeLists_plugins.txt
      - .github/workflows/b2s-plugin.yml
  push:
    branches: [master, b2s-pro]
    paths:
      - plugins/b2s/**
      - plugins/plugins/**
      - CMakeLists.txt
      - make/CMakeLists_plugin_B2S.txt
      - make/CMakeLists_plugins.txt
      - .github/workflows/b2s-plugin.yml

defaults:
  run:
    shell: bash

jobs:
  build:
    name: B2S plugin ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
          - platform: windows
            arch: x86
          - platform: windows-mingw
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v3
      - if: matrix.platform == 'windows-mingw'
        name: Install the mingw toolchain
        run: /c/msys64/usr/bin/bash.exe -l -c "pacman -S --noconfirm --needed make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-tools"
      - name: Fetch the PinMAME plugin API header
        # The plugin includes pinmame/PinMAMEPlugin.h from third-party/include/pinmame, which the
        # full dependency build (external.sh) extracts from the pinmame sources. A plugin only
        # build just needs that single standalone interface header. Download it raw: cloning with
        # git would reuse the credentials injected by actions/checkout, which are rejected by
        # other repositories than the checked out one
        run: |
          mkdir -p third-party/include/pinmame
          curl -fsSL https://raw.githubusercontent.com/vpinball/pinmame/master/src/libpinmame/PinMAMEPlugin.h -o third-party/include/pinmame/PinMAMEPlugin.h
          head -3 third-party/include/pinmame/PinMAMEPlugin.h
      - if: matrix.platform == 'windows'
        name: Build (MSVC)
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then VS_ARCH=x64; else VS_ARCH=Win32; fi
          cmake -DPLATFORM=windows -DARCH=${{ matrix.arch }} -DBUILD_APP=OFF -DPOST_BUILD_COPY_EXT_LIBS=OFF -A $VS_ARCH -B build
          cmake --build build --config "${{ inputs.config || 'Release' }}" --target B2SPlugin --parallel
      - if: matrix.platform == 'windows-mingw'
        name: Build (mingw)
        run: |
          CURRENT_DIR="$(pwd)"
          MSYSTEM=UCRT64 /c/msys64/usr/bin/bash.exe -l -c "
            cd \"${CURRENT_DIR}\" &&
            cmake -DPLATFORM=windows-mingw -DARCH=${{ matrix.arch }} -DBUILD_APP=OFF -DPOST_BUILD_COPY_EXT_LIBS=OFF -DCMAKE_BUILD_TYPE=${{ inputs.config || 'Release' }} -B build &&
            cmake --build build --target B2SPlugin -- -j\$(nproc)
          "
      - if: matrix.platform == 'windows-mingw'
        name: Stage the mingw runtime
        # The mingw built plugin needs its C/C++ runtime DLLs next to it (the MSVC build uses
        # a static runtime and needs none)
        run: |
          cp /c/msys64/ucrt64/bin/libstdc++-6.dll build/plugins/b2s-pro/
          cp /c/msys64/ucrt64/bin/libgcc_s_seh-1.dll build/plugins/b2s-pro/
          cp /c/msys64/ucrt64/bin/libwinpthread-1.dll build/plugins/b2s-pro/
      - name: Package the plugin
        # MSVC is a multi-config generator and places the DLL under a per-config subdirectory
        run: |
          mkdir -p staging/b2s-pro
          cp build/plugins/b2s-pro/plugin.cfg staging/b2s-pro/
          if compgen -G "build/plugins/b2s-pro/*.dll" > /dev/null; then
            cp build/plugins/b2s-pro/*.dll staging/b2s-pro/
          else
            cp build/plugins/b2s-pro/"${{ inputs.config || 'Release' }}"/*.dll staging/b2s-pro/
          fi
          cd staging
          7z a -tzip "../b2s-pro-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.config || 'Release' }}.zip" b2s-pro
      - uses: actions/upload-artifact@v7
        with:
          name: b2s-pro-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.config || 'Release' }}
          path: b2s-plugin-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.config || 'Release' }}.zip
          archive: false
