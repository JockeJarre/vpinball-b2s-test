# Builds only the B2S plugin for Windows (no application), and uploads the plugin
# folder as a zip artifact: extract it into the Visual Pinball "plugins" folder
# (it provides plugins/b2s-pro/, so that it does not collide with the official B2S
# plugin). Manually runnable from any branch, run on pull requests touching the
# plugin, and run on pushes to master and b2s-pro.
#
# Only the Windows x64 build is done here, the flavor of the official BGFX Windows
# application. The plugin library does not select a renderer (it only calls the host
# render API), so this is the MSVC build of the plugin, the one to install on a
# stock Windows VPX. The 32-bit and the mingw builds are made locally with
# tools/build_b2s_plugin_windows.sh (which documents the root-less cross toolchain
# recipe), keeping this job a single one: the Windows runners are the scarce
# resource of this repository. The host sources (src/) are not built here: this job
# builds the B2SPlugin target only, the composited-renderers host change (handover
# section 12) needs a full application build.
name: b2s-plugin
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Build configuration"
        required: false
        default: Release
        type: choice
        options: [Release, Debug]
  pull_request:
    paths:
      - plugins/b2s/**
      - plugins/plugins/**
      - CMakeLists.txt
      - make/CMakeLists_plugin_B2S.txt
      - make/CMakeLists_plugins.txt
      - .github/workflows/b2s-plugin.yml
  push:
    branches: [master, b2s-pro]
    paths:
      - plugins/b2s/**
      - plugins/plugins/**
      - CMakeLists.txt
      - make/CMakeLists_plugin_B2S.txt
      - make/CMakeLists_plugins.txt
      - .github/workflows/b2s-plugin.yml

defaults:
  run:
    shell: bash

jobs:
  build:
    name: B2S plugin windows-x64
    runs-on: windows-latest
    env:
      # Single source of truth for the zip, artifact and upload path names (a mismatch between
      # the zip written by 'Package the plugin' and the upload 'path' silently uploads nothing,
      # since a missing path is only a warning)
      PKG_NAME: b2s-pro-windows-x64-${{ inputs.config || 'Release' }}
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - name: Fetch the PinMAME plugin API header
        # The plugin includes pinmame/PinMAMEPlugin.h from third-party/include/pinmame, which the
        # full dependency build (external.sh) extracts from the pinmame sources. A plugin only
        # build just needs that single standalone interface header. Download it raw: cloning with
        # git would reuse the credentials injected by actions/checkout, which are rejected by
        # other repositories than the checked out one
        run: |
          mkdir -p third-party/include/pinmame
          curl -fsSL https://raw.githubusercontent.com/vpinball/pinmame/master/src/libpinmame/PinMAMEPlugin.h -o third-party/include/pinmame/PinMAMEPlugin.h
          head -3 third-party/include/pinmame/PinMAMEPlugin.h
      - name: Build (MSVC, x64)
        run: |
          cmake -DPLATFORM=windows -DARCH=x64 -DBUILD_APP=OFF -DPOST_BUILD_COPY_EXT_LIBS=OFF -A x64 -B build
          cmake --build build --config "${{ inputs.config || 'Release' }}" --target B2SPlugin --parallel
      - name: Package the plugin
        # MSVC is a multi-config generator and places the DLL under a per-config subdirectory
        run: |
          mkdir -p staging/b2s-pro
          cp build/plugins/b2s-pro/plugin.cfg staging/b2s-pro/
          if compgen -G "build/plugins/b2s-pro/*.dll" > /dev/null; then
            cp build/plugins/b2s-pro/*.dll staging/b2s-pro/
          else
            cp build/plugins/b2s-pro/"${{ inputs.config || 'Release' }}"/*.dll staging/b2s-pro/
          fi
          cd staging
          7z a -tzip "../${PKG_NAME}.zip" b2s-pro
          # Fail loudly instead of uploading nothing when the package is missing/empty
          test -s "../${PKG_NAME}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.zip
          archive: false
          if-no-files-found: error
